<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>Noise suppression</title>
  <desc>Five voice bars rising to the middle, the waveform Discord uses for its noise suppression button. Repository artwork, sized to the Phosphor 256-unit grid.</desc>
  <g stroke="#fff" stroke-width="24" stroke-linecap="round">
    <line x1="40" y1="108" x2="40" y2="148"/>
    <line x1="84" y1="80" x2="84" y2="176"/>
    <line x1="128" y1="44" x2="128" y2="212"/>
    <line x1="172" y1="80" x2="172" y2="176"/>
    <line x1="216" y1="108" x2="216" y2="148"/>
  </g>
</svg>
